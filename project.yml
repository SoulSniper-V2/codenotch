name: Codenotch
options:
  bundleIdPrefix: com.soulsniper
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sources/Info.plist reads both from here — hardcoding them there instead
    # silently pins every build to one version. Bump CURRENT_PROJECT_VERSION
    # on every release.
    MARKETING_VERSION: "1.3.3"
    CURRENT_PROJECT_VERSION: "8"

    # Signed with a stable identity on purpose. The app reads Claude Code's
    # OAuth token out of the login keychain, and the keychain's ACL remembers
    # *which signed binary* was allowed. Ad-hoc or unsigned builds get a new
    # identity on every rebuild, so "Always Allow" would be forgotten each time
    # and the prompt would come back after every `make run`.
    CODE_SIGN_IDENTITY: "Developer ID Application"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: B4932KX535
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    # Required by notarization. Worth knowing what it does *not* break here:
    # the keychain read is unaffected (the ACL keys on the signing identity,
    # which is unchanged), and reading Cursor's and Codex's SQLite files is
    # ordinary file access. It is the App Sandbox that would break both, which
    # is why that stays off — Developer ID distribution does not require it.
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Codenotch
        CFBundleDisplayName: Codenotch
        LSMinimumSystemVersion: "26.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # No update feed on purpose: this copy never phones home. New versions
        # come from wherever it was installed from — there is nothing here for
        # Sparkle to check, so Sparkle is not in the build at all.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulsniper.codenotch
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soulsniper.codenotch.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
